services:
  mc-forge:
    build: .
    container_name: mc_forge_server
    ports:
      - "25565:25565"
    volumes:
      - ./mods:/work/mods
      - ./world:/work/world
      - ./config:/work/config
    stdin_open: true
    tty: true
    restart: unless-stopped