services:
  mcserver:
    build: mcs
    container_name: MinecraftServer_v1.20.2
    volumes:
      - world_data:/work
    ports:
      - 25565:25565
    tty: true
    stdin_open: true
    environment:
      MCRCON_PORT: ${MCRCON_PORT}
      MCRCON_PASS: ${MCRCON_PASS}
    restart: on-failure
    depends_on:
      - db

volumes:
  world_data:
  mcsdb_data:
